<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>合格ダッシュボード｜横浜市立大学 国際商学部</title>
<style>
  :root{
    --bg-950:#020617; --bg-900:#0f172a; --bg-800:#1e293b; --bg-700:#334155;
    --line-800:#1e293b; --line-700:#334155; --line-600:#475569;
    --tx-100:#f1f5f9; --tx-200:#e2e8f0; --tx-300:#cbd5e1; --tx-400:#94a3b8; --tx-500:#64748b; --tx-600:#475569;
    --cyan-400:#22d3ee; --cyan-500:#06b6d4; --cyan-600:#0891b2;
    --emerald-400:#34d399; --emerald-500:#10b981; --emerald-600:#059669; --emerald-950:#022c22;
    --red-400:#f87171; --amber-400:#fbbf24;
    --orange-300:#fdba74; --orange-700:#c2410c; --orange-950:#431407;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-950); color:var(--tx-200);
    font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;
    display:flex; min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- サイドバー ---------- */
  #sidebar{
    width:240px; flex-shrink:0; background:var(--bg-900);
    border-right:1px solid var(--line-800); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{ padding:20px 16px; border-bottom:1px solid var(--line-800); display:flex; gap:10px; align-items:center;}
  .brand-icon{width:32px;height:32px;border-radius:8px;background:var(--cyan-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-title{font-size:13px;font-weight:600;color:#fff;line-height:1.3;}
  .brand-sub{font-size:11px;color:var(--tx-500);line-height:1.3;}

  nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:6px;
    background:transparent;color:var(--tx-400);font-size:14px;text-align:left;transition:background .15s,color .15s;
  }
  .nav-item:hover{background:var(--bg-800);color:var(--tx-200);}
  .nav-item.active{background:var(--bg-700);color:#fff;}
  .nav-item .badge-count{margin-left:auto;font-size:11px;background:var(--bg-700);color:var(--tx-200);padding:1px 7px;border-radius:999px;}
  .nav-item.active .badge-count{background:var(--bg-800);}

  .countdown{padding:14px 16px;border-top:1px solid var(--line-800);font-size:11px;color:var(--tx-500);}
  .countdown b{display:block;font-size:18px;color:var(--cyan-400);margin-top:2px;}

  /* ---------- メイン ---------- */
  #main{flex:1; overflow-y:auto; height:100vh;}
  #content{max-width:1200px;margin:0 auto;padding:32px 36px;}

  .section-head{margin-bottom:20px;}
  .section-head h2{font-size:19px;font-weight:700;color:var(--tx-100);margin:0;}
  .section-head p{font-size:13px;color:var(--tx-400);margin:4px 0 0;}

  .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;}

  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-primary{background:var(--cyan-600);color:#fff;}
  .btn-primary:hover{background:var(--cyan-500);}
  .btn-success{background:var(--emerald-600);color:#fff;}
  .btn-success:hover{background:var(--emerald-500);}
  .btn-disabled{background:var(--bg-800);color:var(--tx-600);cursor:not-allowed;}
  .btn-ghost{background:var(--bg-900);color:var(--tx-400);border:1px solid var(--line-700);}
  .btn-ghost.active{background:var(--bg-700);color:#fff;}

  /* ---------- テーブル ---------- */
  .panel{border:1px solid var(--line-800);border-radius:10px;overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    background:var(--bg-900);color:var(--tx-500);font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    text-align:left;padding:11px 12px;white-space:nowrap;
  }
  tbody td{padding:11px 12px;vertical-align:top;border-top:1px solid var(--line-800);}
  tbody tr:nth-child(odd){background:rgba(255,255,255,0.015);}
  tbody tr.row-done{background:rgba(16,185,129,0.07);}

  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;border:1px solid;font-size:11px;font-weight:600;white-space:nowrap;}
  .badge-date{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;border:1px solid;font-size:10.5px;font-weight:600;margin-top:4px;}
  .badge-carry{background:var(--orange-950);color:var(--orange-300);border-color:var(--orange-700);}
  .badge-today{background:#083344;color:#67e8f9;border-color:#0e7490;}
  .badge-future{background:var(--bg-800);color:var(--tx-500);border-color:var(--line-700);}

  .subj-英語{background:#0c4a6e;color:#7dd3fc;border-color:#0369a1;}
  .subj-数学{background:#4c1d95;color:#c4b5fd;border-color:#6d28d9;}
  .subj-国語{background:#881337;color:#fda4af;border-color:#be123c;}
  .subj-日本史{background:#78350f;color:#fcd34d;border-color:#b45309;}
  .subj-政経{background:#064e3b;color:#6ee7b7;border-color:#047857;}
  .subj-理科基礎{background:#134e4a;color:#5eead4;border-color:#0f766e;}
  .subj-情報Ⅰ{background:#312e81;color:#a5b4fc;border-color:#4338ca;}
  .subj-調整{background:var(--bg-700);color:var(--tx-300);border-color:var(--line-600);}

  .chk-btn{background:none;border:none;padding:0;display:inline-flex;color:var(--tx-600);}
  .chk-btn.checked{color:var(--emerald-400);}
  .chk-btn:hover{color:var(--tx-400);}

  input[type=text],input[type=number],input[type=date],textarea,select{
    background:var(--bg-800);border:1px solid var(--line-700);border-radius:5px;color:var(--tx-100);
    padding:6px 8px;font-size:12.5px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan-500);box-shadow:0 0 0 1px var(--cyan-500);}
  .w-full{width:100%;}
  .actual-input{width:64px;text-align:center;}
  .memo-input{width:100%;}
  .kpi-text{color:var(--tx-400);font-size:12px;line-height:1.5;}
  .del-btn{background:none;border:none;color:var(--tx-600);}
  .del-btn:hover{color:var(--red-400);}

  /* ---------- フォーム ---------- */
  .add-form{margin-top:22px;border:1px solid var(--line-800);background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;}
  .add-form-label{font-size:11px;color:var(--tx-500);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
  .add-grid{display:grid;grid-template-columns:120px 90px 1fr 1.6fr 1.6fr 80px;gap:8px;}
  .add-grid input,.add-grid select{width:100%;padding:9px 8px;font-size:13px;}

  /* ---------- 模試カード ---------- */
  .mock-card{border:1px solid var(--line-800);background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;margin-bottom:14px;}
  .mock-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;}
  .mock-name{font-weight:700;color:var(--tx-100);font-size:14.5px;}
  .mock-date{font-size:11.5px;color:var(--tx-500);margin-top:2px;}
  .mock-stats{display:flex;gap:20px;}
  .mock-stat{text-align:right;}
  .mock-stat span{display:block;font-size:10.5px;color:var(--tx-500);}
  .mock-stat b{font-size:18px;color:var(--tx-100);}
  .mock-stat b.negative{color:var(--red-400);}
  .mock-stat b.positive{color:var(--emerald-400);}
  .mock-scores{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px;}
  .mock-scores label{font-size:10.5px;color:var(--tx-500);display:block;margin-bottom:3px;}
  .mock-scores input{width:100%;text-align:center;}
  .mock-notes{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mock-notes label{font-size:10.5px;color:var(--tx-500);display:block;margin-bottom:3px;}
  .mock-notes textarea{width:100%;resize:vertical;font-size:12px;min-height:44px;}

  /* ---------- KPIマスタ ---------- */
  .kpi-item{border:1px solid var(--line-800);border-radius:10px;overflow:hidden;margin-bottom:10px;}
  .kpi-toggle{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-900);border:none;color:var(--tx-100);font-size:14px;font-weight:600;}
  .kpi-toggle:hover{background:#182338;}
  .kpi-toggle .chev{color:var(--tx-500);display:flex;}
  .kpi-round{color:var(--cyan-400);font-weight:700;white-space:nowrap;}
  .kpi-caution{color:#fcd34d;}

  /* ---------- 週間/月間 ---------- */
  .plan-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .week-scroll{max-height:620px;overflow-y:auto;}
  thead.sticky th{position:sticky;top:0;z-index:1;}
  .month-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .month-card{border:1px solid var(--line-800);background:rgba(255,255,255,0.02);border-radius:10px;padding:16px;}
  .month-name{color:var(--cyan-400);font-size:13px;font-weight:700;margin-bottom:4px;}
  .month-goal{color:var(--tx-100);font-weight:600;margin-bottom:4px;}
  .month-detail{color:var(--tx-400);font-size:12px;line-height:1.5;}

  .empty-state{padding:44px 20px;text-align:center;color:var(--tx-500);font-size:13px;background:rgba(255,255,255,0.02);}

  @media(max-width:900px){
    #sidebar{position:fixed;z-index:20;transform:translateX(-100%);transition:transform .2s;}
    #sidebar.open{transform:translateX(0);}
  }
</style>
</head>

/* ============================================================
   状態管理（localStorageに永続化）
   ============================================================ */
function loadState(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return structuredClone(fallback);
    return JSON.parse(raw);
  }catch(e){ return structuredClone(fallback); }
}
function saveState(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

let tasks = loadState(STORAGE_KEYS.tasks, DEFAULT_TASKS);
let history = loadState(STORAGE_KEYS.history, []);
let mocks = loadState(STORAGE_KEYS.mocks, DEFAULT_MOCKS);
let taskIdSeq = Math.max(0, ...tasks.map(t=>t.id), ...history.map(h=>h.id||0)) + 1;

function persistTasks(){ saveState(STORAGE_KEYS.tasks, tasks); }
function persistHistory(){ saveState(STORAGE_KEYS.history, history); }
function persistMocks(){ saveState(STORAGE_KEYS.mocks, mocks); }

/* ============================================================
   ユーティリティ
   ============================================================ */
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-");
  return `${y}/${m}/${d}`;
}
function nowStamp(){
  const d=new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function esc(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function subjectBadge(subject){
  return `<span class="badge subj-${esc(subject)}">${esc(subject)}</span>`;
}
function dateBadge(date){
  const today = todayStr();
  if(date < today) return `<span class="badge-date badge-carry">繰り越し</span>`;
  if(date === today) return `<span class="badge-date badge-today">本日</span>`;
  return `<span class="badge-date badge-future">予定</span>`;
}

  const target = new Date(2027,0,16);
  const now = new Date();
  return Math.ceil((target-now)/(1000*60*60*24));
}

  document.getElementById("content").innerHTML = `
    <div class="top-row">
      <div class="section-head">
        <h2>タスク管理ボード（今日やること）</h2>
        <p>未完了タスクは日付を問わずボード上に残り続けます。完了したタスクのみ記録・削除されます。</p>

      <button id="btn-record" class="btn ${completedCount===0?'btn-disabled':'btn-success'}" ${completedCount===0?'disabled':''}>

    </div>

    <div class="panel">
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th style="width:110px;">予定日付</th>
            <th style="width:48px;text-align:center;">完了</th>
            <th style="width:90px;">科目</th>
            <th style="width:160px;">教材</th>
            <th style="width:220px;">タスク内容</th>
            <th style="width:280px;">KPI（学習目的・意識ポイント）</th>
            <th style="width:70px;text-align:center;">目標(分)</th>
            <th style="width:80px;text-align:center;">実績(分)</th>
            <th style="width:160px;">メモ・NG問</th>
            <th style="width:36px;"></th>
          </tr></thead>
          <tbody>${rows || `<tr><td colspan="10" class="empty-state">タスクがありません。下のフォームから追加してください。</td></tr>`}</tbody>
        </table>
      </div>
    </div>

    <div class="add-form">
      <div class="add-form-label">新規タスクを追加</div>
      <div class="add-grid">
        <input type="date" id="nt-date" value="${newTaskDraft.date}" />
        <select id="nt-subject">${SUBJECTS.map(s=>`<option value="${s}" ${newTaskDraft.subject===s?'selected':''}>${s}</option>`).join("")}</select>
        <input type="text" id="nt-material" placeholder="教材名" value="${esc(newTaskDraft.material)}" />
        <input type="text" id="nt-task" placeholder="タスク内容（ページ・問題番号）" value="${esc(newTaskDraft.task)}" />
        <input type="text" id="nt-kpi" placeholder="KPI・意識ポイント" value="${esc(newTaskDraft.kpi)}" />
        <input type="number" id="nt-target" placeholder="目標分" value="${esc(newTaskDraft.target)}" />
      </div>
      <button id="btn-add-task" class="btn btn-primary" style="margin-top:12px;">${ICONS.plus} タスクを追加</button>
    </div>
  `;

  document.getElementById("btn-record").onclick = recordAndReset;
  document.getElementById("btn-add-task").onclick = addTask;

  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.id);
      const t = tasks.find(x=>x.id===id);
      t.checked = !t.checked;
      persistTasks();
      renderBoard();
      renderNav();
    };
  });
  document.querySelectorAll('[data-action="actual"]').forEach(el=>{
    el.oninput = ()=>{
      const id = Number(el.dataset.id);

      persistTasks();
      renderBoard();
      renderNav();
    };

  });
}

function addTask(){
  const material = document.getElementById("nt-material").value.trim();
  const task = document.getElementById("nt-task").value.trim();
  if(!material || !task) return;
  tasks.push({
    id: taskIdSeq++,
    date: document.getElementById("nt-date").value || todayStr(),
    checked: false,
    subject: document.getElementById("nt-subject").value,
    material,
    task,
    kpi: document.getElementById("nt-kpi").value,
    target: document.getElementById("nt-target").value === "" ? "" : Number(document.getElementById("nt-target").value),
    actual: "",
    memo: "",
  });
  persistTasks();
  newTaskDraft = { date: todayStr(), subject:"英語", material:"", task:"", kpi:"", target:"" };
  renderBoard();
  renderNav();
}

function recordAndReset(){
  const done = tasks.filter(t=>t.checked);
  if(done.length===0) return;
  const stamp = nowStamp();
  history = [...done.map(t=>({...t, executedAt: stamp})), ...history];
  tasks = tasks.filter(t=>!t.checked);
  persistTasks();
  persistHistory();
  renderBoard();
  renderNav();
}

function renderMock(){

  list.innerHTML = mocks.map(m=>mockCardHTML(m)).join("");

  mocks.forEach(m=>{
    MOCK_SUBJECT_KEYS.forEach(k=>{
      const el = document.querySelector(`[data-mock-score="${m.id}-${k}"]`);
      el.oninput = ()=>{
        m.scores[k] = el.value === "" ? "" : Number(el.value);
        persistMocks();
        updateMockStats(m.id);
      };
    });
    document.querySelector(`[data-mock-field="${m.id}-issues"]`).oninput = (e)=>{ m.issues = e.target.value; persistMocks(); };
    document.querySelector(`[data-mock-field="${m.id}-action"]`).oninput = (e)=>{ m.action = e.target.value; persistMocks(); };
  });
}
function mockCardHTML(m){
  const currentTotal = MOCK_SUBJECT_KEYS.reduce((sum,k)=> sum + (Number(m.scores[k])||0), 0);
  const gap = currentTotal - m.target;
  return `
    <div class="mock-card" data-mock-card="${m.id}">
      <div class="mock-head">
        <div>
          <div class="mock-name">${esc(m.name)}</div>
          <div class="mock-date">実施予定日: ${fmtDate(m.date)}</div>
        </div>
        <div class="mock-stats">
          <div class="mock-stat"><span>現状合計</span><b data-mock-total="${m.id}">${currentTotal}</b></div>
          <div class="mock-stat"><span>目標合計</span><b style="color:var(--tx-300);">${m.target}</b></div>
          <div class="mock-stat"><span>ギャップ</span><b data-mock-gap="${m.id}" class="${gap<0?'negative':'positive'}">${gap>0?'+'+gap:gap}</b></div>
        </div>
      </div>
      <div class="mock-scores">
        ${MOCK_SUBJECT_KEYS.map(k=>`
          <div><label>${k}</label><input type="number" data-mock-score="${m.id}-${k}" value="${esc(m.scores[k])}" placeholder="-" /></div>
        `).join("")}
      </div>
      <div class="mock-notes">
        <div><label>失点要因・課題分析</label><textarea data-mock-field="${m.id}-issues" placeholder="未受験">${esc(m.issues)}</textarea></div>
        <div><label>次回への計画修正アクション</label><textarea data-mock-field="${m.id}-action" placeholder="未受験">${esc(m.action)}</textarea></div>
      </div>
    </div>`;
}
function updateMockStats(id){
  const m = mocks.find(x=>x.id===id);
  const currentTotal = MOCK_SUBJECT_KEYS.reduce((sum,k)=> sum + (Number(m.scores[k])||0), 0);
  const gap = currentTotal - m.target;
  document.querySelector(`[data-mock-total="${id}"]`).textContent = currentTotal;
  const gapEl = document.querySelector(`[data-mock-gap="${id}"]`);
  gapEl.textContent = gap>0 ? '+'+gap : gap;
  gapEl.className = gap<0 ? 'negative' : 'positive';
}

          <span>${esc(mat.material)}</span>
          ${subjectBadge(mat.subject)}
        </button>
        ${open ? `
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th style="width:70px;">周回</th><th>周回目的</th><th>具体的取り組み方</th><th>完成基準（到達レベル）</th><th>注意点・禁止事項</th>
              </tr></thead>
              <tbody>
                ${mat.rounds.map(r=>`
                  <tr>
                    <td class="kpi-round">${r.round}</td>
                    <td style="color:var(--tx-200);">${esc(r.purpose)}</td>
                    <td class="kpi-text">${esc(r.method)}</td>
                    <td class="kpi-text">${esc(r.criteria)}</td>
                    <td class="kpi-text kpi-caution">${esc(r.caution)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        ` : ""}
      </div>`;
  }).join("");

  document.querySelectorAll('[data-kpi-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const mat = el.dataset.kpiToggle;
      expandedMaterial = expandedMaterial===mat ? null : mat;
      renderKpi();
    };
  });
}

/* ============================================================
   ⑤ 週間計画・月間ロードマップ
   ============================================================ */
function renderPlan(){
  document.getElementById("content").innerHTML = `
    <div class="section-head">
      <h2>週間計画・月間ロードマップ</h2>
      <p>24週間の学習フェーズと、月ごとの戦略目標を確認できます。</p>
    </div>
    <div class="plan-tabs">
      <button class="btn btn-ghost ${planSubTab==='weekly'?'active':''}" data-plan-tab="weekly">週間計画（Week1〜24）</button>
      <button class="btn btn-ghost ${planSubTab==='monthly'?'active':''}" data-plan-tab="monthly">月間ロードマップ</button>
    </div>
    <div id="plan-body"></div>
  `;
  document.querySelectorAll('[data-plan-tab]').forEach(el=>{
    el.onclick = ()=>{ planSubTab = el.dataset.planTab; renderPlan(); };
  });
  const body = document.getElementById("plan-body");
  if(planSubTab==="weekly"){
    body.innerHTML = `
      <div class="panel"><div class="week-scroll"><table>
        <thead class="sticky"><tr>
          <th style="width:80px;">週</th><th style="width:120px;">期間</th><th style="width:260px;">テーマ</th><th>重点科目</th><th>フォーカス</th>
        </tr></thead>
        <tbody>
          ${WEEKLY_PLAN.map(w=>`
            <tr>
              <td style="color:var(--cyan-400);font-weight:700;">Week ${w.week}</td>
              <td style="white-space:nowrap;color:var(--tx-400);">${w.range}</td>
              <td style="color:var(--tx-100);">${esc(w.theme)}</td>
              <td class="kpi-text">${esc(w.subjects)}</td>
              <td class="kpi-text">${esc(w.focus)}</td>
            </tr>`).join("")}
        </tbody>
      </table></div></div>
    `;
  }else{
    body.innerHTML = `
      <div class="month-grid">
        ${MONTHLY_ROADMAP.map(m=>`
          <div class="month-card">
            <div class="month-name">${m.month}</div>
            <div class="month-goal">${esc(m.goal)}</div>
            <div class="month-detail">${esc(m.detail)}</div>
          </div>`).join("")}
      </div>
    `;
  }
}

/* ============================================================
   タブ切り替え・初期化
   ============================================================ */
const RENDERERS = { board:renderBoard, history:renderHistory, mock:renderMock, kpi:renderKpi, plan:renderPlan };

function switchTab(tab){
  activeTab = tab;
  renderNav();
  RENDERERS[tab]();
}

document.getElementById("nav").addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-nav]");
  if(btn) switchTab(btn.dataset.nav);
});

renderNav();
switchTab("board");
</script>
</body>
</html>
